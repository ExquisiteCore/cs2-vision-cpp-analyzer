# Fixed production profile: GTX 1080 Ti / ORT 1.17.3 / TensorRT 8.6.1.6 / FP32.
backend=ort-tensorrt
tensorrt_cache_path=cache/ort-trt-sm61-fp32
input=dxgi
dxgi_adapter=0
dxgi_output=0
dxgi_timeout_ms=16
dxgi_gpu_preference=default

# Set width and height together to enable GPU-side ROI capture.
dxgi_roi_x=0
dxgi_roi_y=0
dxgi_roi_width=0
dxgi_roi_height=0

hid_gain=1.0
hid_max_step=120
hid_deadzone_px=1.5
hid_click=false
hid_click_cooldown_frames=6

# Safety default: setup and diagnostics never arm RP2350 output.
output_enabled=false

body_head_anchor_ratio=0.18
kalman_process_noise=0.08
kalman_measurement_noise=6.0
kalman_error_covariance=8.0
status_every_frames=1
